image:
  repository: openwrt-k3s
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

# Multus: drei physische Interfaces via host-device komplett in den Pod verschieben
hostInterfaces:
#  - name: wlp3s0
#    nadName: openwrt-wlp3s0
  - name: enp2s0
    nadName: openwrt-enp2s0
    ifName: lan
  - name: enp4s0f3u1u4
    nadName: openwrt-enp4s0
    ifName: wan

# Zwei veth-Paare (Multus bridge-CNI legt jeweils ein veth-Paar an,
# Pod-seitiges Interface trägt den gewünschten Namen).
# Das Bridge-Plugin verlangt eine IPAM-Antwort (leeres static-IPAM -> "missing ip config"),
# daher host-local mit Link-Local-Dummy. Echte Adressen: DHCP-Server im Pod (OpenWrt),
# Host holt sich seine Adresse per systemd-networkd, sobald das Interface da ist.
# Passt zu den Units unter doc/host/ (br-opnwrtk3s, br-opnwrtmgmt).
vethInterfaces:
  - nadName: opnwrt-k3s
    ifName: lan-opnwrtk3s
    bridge: br-opnwrtk3s
    dummySubnet: "169.254.200.0/24"
  - nadName: opnwrt-mgmt
    ifName: lan-opnwrtmgmt
    bridge: br-opnwrtmgmt
    dummySubnet: "169.254.201.0/24"

security:
  privileged: false
  capabilities:
    add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    drop:
      - ALL

persistence:
  overlay:
    enabled: true
    size: 1Gi
    storageClass: ""
    mountPath: /overlay
  config:
    enabled: true
    size: 512Mi
    storageClass: ""
    mountPath: /etc/config

rfkill:
  hostPath: /dev/rfkill
  containerPath: /dev/rfkill

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
