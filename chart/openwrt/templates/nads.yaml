{{- range .Values.hostInterfaces }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .nadName }}
  namespace: {{ $.Release.Namespace }}
spec:
  config: '{
    "cniVersion": "0.3.1",
    "type": "host-device",
    "device": "{{ .name }}"
  }'
{{- end }}
{{- range .Values.vethInterfaces }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .nadName }}
  namespace: {{ $.Release.Namespace }}
spec:
  config: '{
    "cniVersion": "0.3.1",
    "type": "bridge",
    "bridge": "{{ .bridge }}",
    "ipam": {
      "type": "host-local",
      "subnet": "{{ .dummySubnet }}"
    }
  }'
{{- end }}
